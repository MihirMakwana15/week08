name: 05 - Terraform Infrastructure

# Provisions/updates the Azure infrastructure (Resource Group, ACR, Storage,
# AKS) that the rest of the pipeline depends on. Runs whenever Terraform
# files change, or manually.

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Validate, Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Cache Terraform state
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: tfstate-${{ github.repository }}
          restore-keys: |
            tfstate-${{ github.repository }}
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        run: terraform output
